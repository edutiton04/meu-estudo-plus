<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Meus Estudos+ — organização de estudos para concursos públicos</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1E3054"/>
<stop offset="100%" stop-color="#131F38"/>
</linearGradient>
</defs>

<rect width="1280" height="320" fill="url(#bg)"/>

<!-- badge -->
<rect x="72" y="108" width="104" height="104" rx="24" fill="#C9A227"/>
<rect x="100" y="130" width="48" height="60" rx="6" fill="#1B2A4A"/>
<line x1="110" y1="146" x2="138" y2="146" stroke="#F5F3EC" stroke-width="4" stroke-linecap="round"/>
<line x1="110" y1="160" x2="138" y2="160" stroke="#F5F3EC" stroke-width="4" stroke-linecap="round"/>
<line x1="110" y1="174" x2="130" y2="174" stroke="#F5F3EC" stroke-width="4" stroke-linecap="round"/>
<circle cx="150" cy="182" r="15" fill="#3E8E5A" stroke="#1E3054" stroke-width="3"/>
<path d="M143 182 L148 187 L158 176" fill="none" stroke="#F5F3EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<!-- wordmark -->
<text x="204" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="#F5F3EC">Meus Estudos<tspan fill="#C9A227">+</tspan></text>
<text x="205" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#9FB0CC">Organização de estudos para concursos públicos</text>

<!-- progress ring: signature element, echoes the app's own edital-coverage indicator -->
<g>
<circle cx="1080" cy="148" r="86" fill="none" stroke="#2A3A5C" stroke-width="14"/>
<circle cx="1080" cy="148" r="86" fill="none" stroke="#C9A227" stroke-width="14" stroke-linecap="round"
  stroke-dasharray="367.4 540.4" transform="rotate(-90 1080 148)"/>
<text x="1080" y="159" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#F5F3EC">68%</text>
</g>
<text x="1080" y="278" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#9FB0CC">cobertura do edital</text>

<!-- repo path -->
<text x="1208" y="302" text-anchor="end" font-family="'Consolas', 'Courier New', monospace" font-size="15" fill="#6E7A99">edutiton04.github.io/meu-estudo-plus</text>
</svg>
